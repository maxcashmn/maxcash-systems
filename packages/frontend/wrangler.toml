name = "maxcash-frontend"
compatibility_date = "2024-01-01"

[env.production]
name = "maxcash-frontend"

[env.production.build]
command = "pnpm build"
cwd = "."

[env.production.build.upload]
dir = "dist"

[[env.production.build.upload.routes]]
pattern = "/*"
zone_id = ""

[env.production.vars]
VITE_API_URL = "https://maxcash-backend.maxcashmn.workers.dev/api/v1"
VITE_APP_NAME = "MaxCash"
